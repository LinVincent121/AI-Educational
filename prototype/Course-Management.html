<!doctype html>
<html lang="zh-CN">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <title>
            AI教务系统
        </title>
        <link rel="stylesheet" href="css/styles.css?v=20260910-08">
        <link rel="stylesheet" href="css/materials-library.css?v=20260910-07">
        <style id="app-preload-visibility">#app{visibility:hidden!important}</style>
    </head>
    
    <body>
        <div id="app">
        </div>
        <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <div>
                    <div class="eyebrow">AI ASSISTANT</div>
                    <h2 id="modalTitle">AI 助手</h2>
                </div>
                <button type="button" id="modalClose" class="icon-btn" aria-label="关闭">×</button>
            </div>
            <p class="muted">课程创建、内容生成和教学任务统一在这里处理。</p>
            <div id="stream" class="stream" aria-live="polite"></div>
            <div class="modal-bottom">
                <button type="button" id="modalRetry" class="btn secondary">重试</button>
                <button type="button" id="modalSave" class="btn primary">保存为草稿</button>
            </div>
        </div>
        <div id="modalBg" class="modal-bg">
        </div>


        <script>
            /* Deep link helper: ?course=economics opens the prototype directly
             * in that course workspace. Without the parameter nothing changes. */
            try {
                var __courseParam = new URLSearchParams(location.search).get('course');
                if (__courseParam) localStorage.setItem('ai-jiaowu-current-course', __courseParam);
            } catch (e) {}
        </script>
        <script src="js/core/00-app-shell.js?v=20260910-05">
        </script>
        <script src="js/core/04-materials-alignment.js?v=20260908-23">
        </script>
        <script src="js/core/01-demo-store.js?v=20260908-23">
        </script>
        <script src="js/core/02-course-create.js?v=20260908-23">
        </script>
        <script src="js/core/03-course-processing.js?v=20260908-23">
        </script>
        <script src="js/core/course-v2-loader.js?v=20260910-05">
        </script>
    </body>

</html>
