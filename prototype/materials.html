/* Course Creation Mode & KB Mounting Styles */
.create-mode-section{margin-bottom:14px}
.form-section-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:baseline;justify-content:flex-start;gap:4px;text-align:left;width:100%}
.form-section-title small{font-weight:normal;color:var(--muted);font-size:11.5px;margin-left:2px}
.create-mode-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.create-mode-card{display:flex;flex-direction:column;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:all .16s ease;position:relative}
.create-mode-card input[type="radio"]{position:absolute;opacity:0;width:0;height:0}
.create-mode-card:hover{border-color:#9edfd5;background:#f9fdfc}
.create-mode-card.active{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 0 0 1px var(--mint)}
.mode-card-header{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.mode-icon{font-size:15px;color:var(--mint);font-weight:700}
.mode-title{font-size:13px;font-weight:700;color:var(--ink)}
.mode-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:#fff;color:#087c72;border:1px solid #bce6df;margin-left:auto;white-space:nowrap}
.mode-desc{margin:0;font-size:11px;color:var(--muted);line-height:1.5}
.mode-hint-new{background:var(--mint-soft);color:#167c73}
.mode-hint-reuse{background:#eef4ff;color:#3366cc;border-color:#c8dafc}

.kb-mount-group{margin-bottom:14px}
.kb-mount-box{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border:1px dashed #bce3dc;border-radius:10px;background:#f6fbf9;transition:all .16s ease}
.kb-mount-box.is-mounted{border-style:solid;border-color:var(--mint);background:var(--mint-soft)}
.kb-mount-info{display:flex;align-items:center;gap:10px;min-width:0}
.kb-mount-info-mounted{flex:1;min-width:0;display:grid;gap:6px}
.kb-mount-head-line{display:flex;align-items:center;gap:8px}
.kb-mounted-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.kb-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;background:#fff;border:1px solid #bde7df;font-size:12px;color:var(--ink)}
.kb-tag-icon{font-style:normal;font-size:13px;color:#0b9c8c}
.kb-tag b{font-weight:600}
.kb-tag small{color:var(--muted);font-size:11px}
.kb-tag-del{border:0;background:transparent;color:#9aa9a6;font-size:15px;line-height:1;padding:0 2px;cursor:pointer;border-radius:4px}
.kb-tag-del:hover{color:var(--danger);background:#feebeb}

.kb-mount-icon{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;border-radius:8px;background:#fff;color:#0b9c8c;font-size:16px;border:1px solid #d4ece7}
.kb-mount-text b{display:block;font-size:13px;color:var(--ink)}
.kb-mount-text small{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.kb-picker-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(24,54,79,.45);backdrop-filter:blur(3px)}
.kb-picker-dialog{width:min(540px,94vw);max-height:85vh;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(24,54,79,.25);overflow:hidden}
.kb-picker-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.kb-picker-head h3{margin:0;font-size:17px;font-weight:700;color:var(--ink)}
.kb-picker-close{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px 8px}
.kb-picker-close:hover{background:#f0f4f5;color:var(--ink)}
.kb-picker-body{padding:16px 20px;overflow-y:auto;display:grid;gap:16px}
.kb-picker-group{display:grid;gap:8px}
.kb-picker-group-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.kb-folder-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;transition:all .14s ease;text-align:left;width:100%}
.kb-folder-item:hover{border-color:#9edfd5;background:var(--mint-soft)}
.kb-folder-item.is-selected{border-color:var(--mint);background:var(--mint-soft);box-shadow:0 0 0 1px var(--mint)}
.kb-folder-checkbox{display:grid;place-items:center;width:18px;height:18px;flex:0 0 18px}
.kb-folder-checkbox input{margin:0;width:16px;height:16px;accent-color:var(--mint);cursor:pointer}
.kb-folder-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.kb-folder-icon{font-size:18px;color:#0b9c8c}
.kb-folder-item b{display:block;font-size:13px;color:var(--ink)}
.kb-folder-item small{display:block;font-size:11px;color:var(--muted)}
.kb-folder-count{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;margin-left:auto}
.kb-picker-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#fcfdfe}
@media(max-width:620px){.create-mode-options{grid-template-columns:1fr}.kb-mount-box{flex-direction:column;align-items:stretch}.kb-mount-box .btn{width:100%;justify-content:center}}

/* Syllabus page header — title left, single right-aligned action rail */
.syllabus-page-head{display:flex;align-items:center;justify-content:space-between;gap:14px 18px;margin:0 0 16px;padding:0 0 14px;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.syllabus-page-title{flex:0 0 auto}
.syllabus-page-title h1{margin:0;font:700 25px/1.3 Georgia,"Microsoft YaHei",serif;color:var(--ink);white-space:nowrap}
.syllabus-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;min-width:0}
.syllabus-head-actions .btn{padding:7px 11px;font-size:12px;white-space:nowrap;border-radius:8px}
.syllabus-head-actions .btn.secondary{background:#eef8f6!important;color:#167c73!important;border:1px solid #d3eae6!important}
.syllabus-head-actions .btn.secondary:hover{background:#e0f4ef!important;color:#0b8d7d!important;border-color:#9edfd5!important}
.syllabus-head-actions .btn.primary{background:var(--orange)!important;color:#fff!important;border:1px solid var(--orange)!important}
.syllabus-head-actions .btn.primary:hover{background:#ed7e55!important}
.syllabus-head-actions .btn:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.syllabus-head-actions .version-select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);font:12px system-ui;cursor:pointer}
.syllabus-head-actions .version-select:focus{outline:2px solid #bdebe3;outline-offset:1px}

/* Syllabus 3-Column Parallel Workspace & Markdown Styles */
.syllabus-3col-workspace{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:16px;align-items:start;min-width:0}
.syllabus-col-left{position:sticky;top:14px}
.syllabus-col-left .outline-progress{position:static;width:100%;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.syllabus-col-mid{min-width:0}

.materials-page .ml-workspace{border-color:var(--line);border-radius:14px;box-shadow:var(--shadow)}.materials-page .ml-sidebar{background:#fff;border-right-color:var(--line)}.materials-page .ml-sidebar-head strong,.materials-page .ml-folder-title h2{color:var(--ink)}.materials-page .ml-sidebar-kicker,.materials-page .ml-folder-kicker{color:#8ba1ad}.materials-page .ml-tree-group-shared{border-top-color:var(--line)}.materials-page .ml-tree-item{color:#496574}.materials-page .ml-tree-item:hover{background:var(--mint-soft);color:#087c72}.materials-page .ml-tree-item.is-active{background:var(--mint-soft);color:#087c72}.materials-page .ml-tree-item:hover .ml-icon,.materials-page .ml-tree-item.is-active .ml-icon{color:#0b9c8c}.materials-page .ml-tree-item.is-active:before{background:var(--mint)}.materials-page .ml-tree-item.is-active em{color:#0b9c8c}.materials-page .ml-tree-add{color:#0b9c8c}.materials-page .ml-tree-add:hover{background:var(--mint-soft)}
.materials-page .ml-folder-mark{background:var(--mint-soft);color:#0b9c8c}.materials-page .ml-ghost-btn{border-color:var(--line);color:#496574}.materials-page .ml-ghost-btn:hover{border-color:#9edfd5;color:#087c72;background:#f7fffd}.materials-page .ml-ghost-btn .ml-icon{color:#0b9c8c}.materials-page .ml-info-strip{border-color:#cfeae3;background:#f0faf7;color:#557473}.materials-page .ml-info-strip b{color:#087c72}.materials-page .ml-info-icon{background:#dff4ee;color:#0b9c8c}.materials-page .ml-info-strip button:hover{background:var(--mint-soft);color:#087c72}.materials-page .ml-file-row:hover{border-color:#cfeae3;background:#f7fffd}.materials-page .ml-file-row.is-selected{border-color:#9edfd5;background:#f0faf7}.materials-page .ml-file-main b{color:var(--ink)}.materials-page .ml-status-dot{background:var(--mint)}.materials-page .ml-more:hover{background:var(--mint-soft);color:#087c72}.materials-page .ml-empty-orbit{border-color:#b6deda;background:#f7fffd;color:#0b9c8c}
.materials-page .ml-search{width:210px;height:34px;border-color:var(--line);box-shadow:none;border-radius:8px}.materials-page .ml-folder-actions .ml-search{order:0}.materials-page .ml-folder-actions .ml-ghost-btn:first-of-type{order:1}.materials-page .ml-folder-actions .ml-ghost-btn:last-of-type{order:2}
@media(max-width:680px){.materials-page .ml-search{width:auto;flex:1}.materials-page .ml-folder-actions{display:flex}.materials-page .ml-folder-actions .ml-search{min-width:0}.materials-page .ml-folder-actions .ml-ghost-btn:first-of-type{flex:0 0 auto}.materials-page .ml-head-actions{grid-template-columns:auto}.materials-page .ml-head-actions .ml-search{display:none}}

</style>
<style>
.materials-standalone-top{display:flex;align-items:center;gap:10px;margin-left:auto;color:#6c8495;font-size:13px;font-weight:600}
.materials-standalone-top b{color:#18364f}
.materials-standalone-back{margin-left:10px;color:#0b9c8c;text-decoration:none;font-size:12px}
.materials-standalone-back:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>✦</i>AI教务系统</div>
  <nav class="topnav">
    <a href="index.html" class="active">▦ 返回课程管理</a>
  </nav>
  <div class="materials-standalone-top"><b>▤ 资料库</b><span>个人知识空间 · 独立版</span></div>
</header>
<div id="app"></div>
<script>
/* ============================================================
 * 资料库独立版 —— 从主原型（00-app-shell.js + 04-materials-alignment.js）
 * 抽取，状态、结构与交互与原路由完全一致；数据保存在本站 localStorage。
 * ============================================================ */
/* Materials is intentionally self-contained: its state, markup and events stay scoped to this route. */
const materialSeed={personal:[{id:'discrete',name:'离散数学',count:4,files:[{name:'离散数学教材.pdf',type:'pdf',size:'24.8 MB',meta:'主教材 · 2026 秋季',updated:'今天 09:42',status:'available'}]},{id:'teaching',name:'教学设计',count:3,files:[{name:'第 3 章例题集.pptx',type:'pptx',size:'8.4 MB',meta:'课堂资料',updated:'昨天 16:20',status:'available'},{name:'课程思政案例.docx',type:'docx',size:'1.2 MB',meta:'教学参考',updated:'9 月 2 日',status:'available'}]},{id:'research',name:'研究与灵感',count:2,files:[]}],shared:[{id:'shared-course',name:'课程共享资料',count:6,files:[{name:'2026 秋季教学日历模板.docx',type:'docx',size:'426 KB',meta:'罗文秋 · 共享给课程组',updated:'9 月 3 日',status:'available'},{name:'图论案例视频链接.url',type:'link',size:'—',meta:'王老师 · 课程共享',updated:'8 月 28 日',status:'available'}]},{id:'shared-school',name:'学校模板',count:12,files:[{name:'本科课程教学大纲模板.docx',type:'docx',size:'2.1 MB',meta:'教务处 · 全校共享',updated:'8 月 18 日',status:'available'}]}]};
let materialState={scope:'personal',folderId:'discrete',selected:null,search:''};
function materialIcon(type='file'){const paths={folder:'<path d="M3.5 6.5h5l1.7 2h10.3v9.8a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2Z"/><path d="M2 9h18.5"/>',search:'<circle cx="10.8" cy="10.8" r="6.2"/><path d="m16 16 4.2 4.2"/>',upload:'<path d="M12 16V4.5M7.5 9 12 4.5 16.5 9M5 14.5v4.2h14v-4.2"/>',pdf:'<path d="M6 2.8h8l4 4v14.4H6z"/><path d="M14 2.8v4h4M8.5 15h2.1a1.4 1.4 0 0 0 0-2.8H8.5v5.6M13 17.8v-5.6h1.8a2.8 2.8 0 0 1 0 5.6H13Z"/>',pptx:'<path d="M5 2.8h9l4 4v14.4H5z"/><path d="M14 2.8v4h4M8 17v-5.2h3.2a1.7 1.7 0 1 1 0 3.4H8m0 0h4"/>',docx:'<path d="M6 2.8h8l4 4v14.4H6z"/><path d="M14 2.8v4h4M9 12h6M9 15h6M9 18h4"/>',link:'<path d="M9.5 14.5 8 16a3.2 3.2 0 0 1-4.5-4.5l2.2-2.2a3.2 3.2 0 0 1 4.5 0M14.5 9.5 16 8a3.2 3.2 0 0 1 4.5 4.5l-2.2 2.2a3.2 3.2 0 0 1-4.5 0M8 16l8-8"/>'};return `<svg class="ml-icon ml-icon-${type}" viewBox="0 0 24 24" aria-hidden="true">${paths[type]||paths.docx}</svg>`}
function materialAllFolders(){const extra=JSON.parse(localStorage.getItem('ml-folders')||'[]');return {personal:[...materialSeed.personal,...extra],shared:materialSeed.shared}}
function materialFindFolder(){return materialAllFolders()[materialState.scope].find(f=>f.id===materialState.folderId)||materialAllFolders()[materialState.scope][0]}
function renderMaterialTree(){const all=materialAllFolders();return `<div class="ml-tree-group"><div class="ml-tree-title"><span>个人知识库</span><button class="ml-tree-add" title="新建知识文件夹" onclick="materialNewFolder()">＋</button></div>${all.personal.map(f=>`<button class="ml-tree-item ${materialState.scope==='personal'&&materialState.folderId===f.id?'is-active':''}" onclick="materialSelectFolder('personal','${f.id}')">${materialIcon('folder')}<span>${f.name}</span><em>${f.files.length}</em></button>`).join('')}</div><div class="ml-tree-group ml-tree-group-shared"><div class="ml-tree-title"><span>共享知识库</span><span class="ml-lock">只读</span></div>${all.shared.map(f=>`<button class="ml-tree-item ${materialState.scope==='shared'&&materialState.folderId===f.id?'is-active':''}" onclick="materialSelectFolder('shared','${f.id}')">${materialIcon('folder')}<span>${f.name}</span><em>${f.files.length}</em></button>`).join('')}</div>`}
function materials(){const folder=materialFindFolder();const files=(folder?.files||[]).filter(f=>!materialState.search||f.name.toLowerCase().includes(materialState.search.toLowerCase()));const isShared=materialState.scope==='shared';return `<main class="global-main materials-page"><div class="ml-page-head"><div><div class="ml-breadcrumb"><span>资料库</span><b>/</b><span>${isShared?'共享知识库':'个人知识库'}</span></div><h1>我的资料库</h1><p>把课程资料收进知识文件夹，随时查找、预览与复用。</p></div><div class="ml-head-actions"><label class="ml-search"><span>${materialIcon('search')}</span><input value="${materialState.search}" oninput="materialSearch(this.value)" placeholder="搜索资料名称" aria-label="搜索资料名称"></label><button class="btn primary ml-upload-head" ${isShared?'disabled':''} onclick="materialTriggerUpload()">${materialIcon('upload')}上传资料<input id="materialFileInput" type="file" hidden multiple onchange="materialUpload(this.files)"></button></div></div><div class="ml-workspace"><aside class="ml-sidebar"><div class="ml-sidebar-head"><div><span class="ml-sidebar-kicker">KNOWLEDGE SPACE</span><strong>知识空间</strong></div><button class="ml-collapse" aria-label="收起目录">‹</button></div><div id="materialTree" class="ml-tree">${renderMaterialTree()}</div><div class="ml-sidebar-foot"><div class="ml-storage"><span>存储使用</span><b>1.2 GB <small>/ 10 GB</small></b><i><em></em></i></div><span>最后同步 · 刚刚</span></div></aside><section class="ml-content"><div class="ml-content-head"><div class="ml-folder-title"><div class="ml-folder-mark">${materialIcon('folder')}</div><div><div class="ml-folder-kicker">${isShared?'共享知识库':'个人知识库'}</div><h2>${folder?.name||'未命名文件夹'}</h2><span>${folder?.files.length||0} 份资料 · ${isShared?'课程组成员可查看':'仅自己可见'}</span></div></div><div class="ml-folder-actions"><button class="ml-ghost-btn" onclick="materialSort(this)">最近更新 <span>⌄</span></button><button class="ml-ghost-btn" ${isShared?'disabled':''} onclick="materialTriggerUpload()">${materialIcon('upload')}添加资料</button></div></div><div class="ml-info-strip"><div><span class="ml-info-icon">✦</span><span><b>知识文件夹</b>　资料会按文件夹自动归档，支持 PDF、Word、PPT 和链接。</span></div><button onclick="this.parentElement.remove()" aria-label="关闭提示">×</button></div>${files.length?`<div class="ml-file-list">${files.map((f,i)=>`<article class="ml-file-row ${materialState.selected===f.name?'is-selected':''}" onclick="materialSelectFile('${f.name.replace(/'/g,"\\'")}')"><div class="ml-file-icon type-${f.type}">${materialIcon(f.type)}</div><div class="ml-file-main"><b>${f.name}</b><span>${f.meta}</span></div><div class="ml-file-size">${f.size}</div><div class="ml-file-status"><span class="ml-status-dot ${f.status==='processing'?'is-processing':''}"></span>${f.status==='processing'?'解析中':'可用'}</div><span class="ml-file-date">${f.updated}</span><button class="ml-more" onclick="event.stopPropagation();materialMore('${f.name.replace(/'/g,"\\'")}')" aria-label="更多操作">•••</button></article>`).join('')}</div>`:`<div class="ml-empty"><div class="ml-empty-orbit">${materialIcon('folder')}</div><h3>${materialState.search?'没有找到匹配资料':'这个文件夹还没有资料'}</h3><p>${materialState.search?'换个关键词试试，或清空搜索。':'上传第一份资料，建立你的知识空间。'}</p>${materialState.search?'<button class="ml-text-btn" onclick="materialSearch(\'\')">清空搜索</button>':(isShared?'':'<button class="btn primary" onclick="materialTriggerUpload()">'+materialIcon('upload')+'上传资料</button>')}</div>`}<div class="ml-content-footer"><span>共 ${files.length} 份${materialState.search?'匹配资料':''}</span><span>支持拖拽上传 · 单个文件最大 500 MB</span></div></section></div></main>`}
function materialRerender(){const app=document.getElementById('app');if(app)app.innerHTML=materials()}
function materialSelectFolder(scope,id){materialState.scope=scope;materialState.folderId=id;materialState.selected=null;materialState.search='';materialRerender()}
function materialSearch(value){materialState.search=value;materialRerender();const input=document.querySelector('.ml-search input');if(input){input.focus();input.setSelectionRange(value.length,value.length)}}
function materialTriggerUpload(){const input=document.getElementById('materialFileInput');if(input)input.click()}
function materialUpload(fileList){const folder=materialFindFolder();if(!folder||materialState.scope==='shared'||!fileList?.length)return;Array.from(fileList).forEach((file,index)=>{folder.files.unshift({name:file.name,type:(file.name.split('.').pop()||'file').toLowerCase(),size:file.size>1048576?(file.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB',meta:'刚刚上传 · 待解析',updated:'刚刚',status:'processing'});});materialSeed.personal.forEach(f=>{if(f.id===folder.id)f.files=folder.files});const extra=JSON.parse(localStorage.getItem('ml-folders')||'[]');const ei=extra.findIndex(f=>f.id===folder.id);if(ei>=0){extra[ei]=folder;localStorage.setItem('ml-folders',JSON.stringify(extra))}materialRerender();setTimeout(()=>{folder.files.forEach(f=>{if(f.status==='processing'){f.status='available';f.meta='个人资料 · 已完成解析';f.updated='刚刚'}});materialRerender()},1100)}
function materialNewFolder(){if(document.querySelector('.ml-dialog-backdrop'))return;const backdrop=document.createElement('div');backdrop.className='ml-dialog-backdrop';backdrop.innerHTML='<div class="ml-dialog" role="dialog" aria-modal="true" aria-labelledby="mlDialogTitle"><button class="ml-dialog-close" onclick="materialCloseFolderDialog()" aria-label="关闭">×</button><span class="ml-dialog-kicker">PERSONAL KNOWLEDGE BASE</span><h3 id="mlDialogTitle">新建知识文件夹</h3><p>给你的资料空间起一个清晰的名字，之后可以在里面持续收集文件。</p><label>文件夹名称<input id="mlFolderName" maxlength="24" placeholder="例如：课程备课" autofocus></label><div class="ml-dialog-actions"><button class="ml-ghost-btn" onclick="materialCloseFolderDialog()">取消</button><button class="btn primary" onclick="materialCommitFolder()">创建文件夹</button></div></div>';backdrop.addEventListener('click',event=>{if(event.target===backdrop)materialCloseFolderDialog()});document.body.appendChild(backdrop);setTimeout(()=>document.getElementById('mlFolderName')?.focus(),0)}
function materialCloseFolderDialog(){document.querySelector('.ml-dialog-backdrop')?.remove()}
function materialCommitFolder(){const input=document.getElementById('mlFolderName');const name=input?.value.trim();if(!name){input?.focus();return}const folder={id:'custom-'+Date.now(),name:name.slice(0,24),count:0,files:[]};const extra=JSON.parse(localStorage.getItem('ml-folders')||'[]');extra.push(folder);localStorage.setItem('ml-folders',JSON.stringify(extra));materialState.scope='personal';materialState.folderId=folder.id;materialState.selected=null;materialCloseFolderDialog();materialRerender()}
function materialSelectFile(name){materialState.selected=name;materialRerender()}
function materialMore(name){window.alert(`${name}\n\n预览、下载、移动到其他文件夹等操作将在正式版本中开放。`)}
function materialSort(button){const folder=materialFindFolder();if(!folder)return;folder.files.reverse();button.innerHTML='名称排序 <span>⌄</span>';materialRerender()}

/* 对齐逻辑（源自 04-materials-alignment.js，独立版无 hash 路由，
 * 改为在每次渲染后同步执行一次） */
function alignMaterials(){
  const page=document.querySelector('.materials-page');
  if(!page)return;
  page.querySelector('.ml-page-head > div:not(.ml-head-actions)')?.remove();
  const search=page.querySelector('.ml-page-head .ml-head-actions .ml-search');
  const actions=page.querySelector('.ml-folder-actions');
  const sort=actions?.querySelector('.ml-ghost-btn');
  if(search&&actions&&search.parentElement!==actions)actions.insertBefore(search,sort||null);
  page.querySelector('.ml-page-head .ml-upload-head')?.remove();
  const headActions=page.querySelector('.ml-page-head .ml-head-actions');
  if(headActions&&!headActions.children.length)headActions.remove();
  const pageHead=page.querySelector('.ml-page-head');
  if(pageHead&&!pageHead.children.length)pageHead.remove();
  if(!page.querySelector('#materialFileInput')){
    const input=document.createElement('input');
    input.id='materialFileInput';input.type='file';input.multiple=true;input.hidden=true;
    input.addEventListener('change',()=>materialUpload(input.files));
    page.appendChild(input);
  }
}
(function(){
  const _rerender=materialRerender;
  materialRerender=function(){_rerender();alignMaterials()};
  const app=document.getElementById('app');
  app.innerHTML=materials();
  alignMaterials();
})();
</script>
</body>
</html>
