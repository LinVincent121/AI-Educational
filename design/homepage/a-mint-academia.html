<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduWork · 首页 — 方向A 青樟</title>
<style>
  /* ============ 方向A · 青樟 Mint Academy ============
     与现有原型同语言：薄荷绿 + 蓝墨 + Georgia 衬线标题 + 等宽 eyebrow
     签名元素：教学工作流卡片的「落地页」注脚（AI 生成 → 在哪编辑） */
  :root{
    --bg:#f6fafa; --surface:#ffffff; --line:#e3eef0; --line-strong:#d5e5e8;
    --mint:#16bda8; --mint-deep:#0b9c8c; --mint-ink:#087c72; --mint-soft:#e6f8f4;
    --ink:#18364f; --muted:#6c8495; --faint:#9ab3bf;
    --orange:#ff8f63; --orange-soft:#fff1ea;
    --shadow:0 8px 24px rgba(54,113,126,.06);
    --serif:Georgia,"Times New Roman","Microsoft YaHei",serif;
    --sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg)}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--mint-deep);outline-offset:2px}
  .app{display:grid;grid-template-columns:264px 1fr;height:100vh;overflow:hidden}

  /* ---------- 左侧栏 ---------- */
  .a-side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint) 0%,var(--mint-deep) 100%);display:grid;place-items:center;flex:none}
  .brand-name{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.01em}
  .brand-name small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.18em;color:var(--muted);margin-top:1px}
  .side-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--faint);padding:14px 10px 8px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;color:var(--muted);text-align:left;transition:background .12s,color .12s}
  .nav-btn svg{flex:none;opacity:.75}
  .nav-btn:hover{background:#f2f8f8;color:var(--ink)}
  .nav-btn.on{background:var(--mint-soft);color:var(--mint-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--mint)}
  .new-btn{margin:12px 4px 0;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;background:var(--mint-soft);color:var(--mint-ink);font-size:13.5px;font-weight:600;transition:background .12s}
  .new-btn:hover{background:#d8f2ec}
  .hist{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
  .hist-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden}
  .hist-item:hover{background:#f2f8f8;color:var(--ink)}
  .hist-item .t{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto;flex:none}
  .hist-item svg{flex:none;opacity:.55}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:10px;padding-left:6px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--mint-soft);color:var(--mint-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .side-foot b{font-size:13px;display:block;line-height:1.3}
  .side-foot span{font-size:11.5px;color:var(--muted)}
  .gear{margin-left:auto;padding:6px;border-radius:8px;color:var(--muted)}
  .gear:hover{background:#f2f8f8;color:var(--ink)}

  /* ---------- 主区 ---------- */
  .a-main{overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:60px 32px 48px;scrollbar-width:thin}
  .hero{width:100%;max-width:860px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--mint-deep)}
  h1{font-family:var(--serif);font-size:34px;font-weight:700;margin:10px 0 8px;letter-spacing:.01em}
  .hero-sub{font-size:15px;color:var(--muted);min-height:24px}

  .modes{display:inline-flex;gap:4px;background:#edf4f5;border:1px solid var(--line);border-radius:999px;padding:4px;margin:24px 0 10px}
  .mode-btn{display:flex;align-items:center;gap:7px;padding:7px 20px;border-radius:999px;font-size:13.5px;color:var(--muted);transition:all .15s}
  .mode-btn:hover{color:var(--ink)}
  .mode-btn.on{background:var(--surface);border:1px solid var(--mint);color:var(--mint-ink);font-weight:600;box-shadow:0 2px 8px rgba(22,189,168,.14)}
  .mode-desc{font-size:12.5px;color:var(--muted);margin-bottom:18px;min-height:20px}
  .mode-desc b{color:var(--mint-ink);font-weight:600}

  /* 输入框 */
  .inputbox{background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;padding:16px 16px 10px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
  .inputbox:focus-within{border-color:var(--mint);box-shadow:0 0 0 4px rgba(22,189,168,.14),var(--shadow)}
  .inputbox textarea{width:100%;border:none;outline:none;resize:none;background:transparent;font-family:var(--sans);font-size:15px;line-height:1.6;min-height:66px;color:var(--ink)}
  .inputbox textarea::placeholder{color:var(--faint)}
  .inputbar{display:flex;align-items:center;gap:8px;margin-top:6px}
  .chip-tool{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 10px;transition:all .12s}
  .chip-tool:hover{border-color:var(--mint);color:var(--mint-ink);background:var(--mint-soft)}
  .inputbar .spacer{flex:1}
  .icon-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;color:var(--muted)}
  .icon-btn:hover{background:#f2f8f8;color:var(--ink)}
  .send{width:36px;height:36px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;transition:background .12s,transform .12s}
  .send:hover{background:var(--mint-deep);transform:translateY(-1px)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);background:var(--surface);transition:all .12s}
  .chip:hover{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-ink)}

  /* 卡片区 */
  .section{width:100%;max-width:860px;margin-top:44px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .sec-head .eyebrow{color:var(--muted)}
  .sec-head::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid-chat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:5px}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(54,113,126,.1);border-color:var(--mint)}
  .card b{font-size:14.5px}
  .card p{font-size:13px;color:var(--muted);flex:1}
  .card .ico{width:34px;height:34px;border-radius:9px;background:var(--mint-soft);color:var(--mint-deep);display:grid;place-items:center;margin-bottom:4px}

  .grid-teach{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .flow-card{position:relative;padding-bottom:14px}
  .flow{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--mint-ink);border-top:1px dashed var(--line);padding-top:9px;margin-top:2px}
  .flow svg{opacity:.7}

  .task-list{display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:left;transition:border-color .15s,box-shadow .15s}
  .task:hover{border-color:var(--mint);box-shadow:var(--shadow)}
  .task .body{flex:1;min-width:0}
  .task .body b{display:block;font-size:14px}
  .task .body span{font-size:12.5px;color:var(--muted)}
  .prog{margin-top:8px;height:5px;border-radius:99px;background:#eaf2f3;overflow:hidden}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--mint-deep))}
  .status{flex:none;font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:99px}
  .status.run{background:var(--mint-soft);color:var(--mint-ink)}
  .status.queue{background:#eef2f4;color:var(--muted)}
  .status.done{background:var(--orange-soft);color:#c96a3f}
  .teach-note{margin-top:16px;font-size:12.5px;color:var(--muted);background:var(--mint-soft);border:1px dashed #bfe8e0;border-radius:10px;padding:10px 14px;display:none}
  .teach-note.show{display:block}

  /* 页脚标注 & toast */
  .concept-tag{position:fixed;right:16px;bottom:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:8px;padding:5px 10px;z-index:5;text-decoration:none}
  .concept-tag:hover{color:var(--mint-ink)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:13px;border-radius:10px;padding:10px 18px;opacity:0;pointer-events:none;transition:all .25s;z-index:9;max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:960px){
    .app{grid-template-columns:1fr}
    .a-side{display:none}
    .grid-teach{grid-template-columns:1fr 1fr}
    h1{font-size:27px}
  }
  @media (max-width:620px){.grid-chat,.grid-teach{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <!-- ================= 左侧栏 ================= -->
  <aside class="a-side">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V15c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.2"/><path d="M22 8.5v5"/></svg>
      </div>
      <div class="brand-name">EduWork<small>教育版 · EDU</small></div>
    </div>

    <div class="side-label">模式 / MODE</div>
    <nav class="nav" id="sideNav">
      <button class="nav-btn on" data-mode="chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/><path d="M9 11h6M9 15h3"/></svg>对话</button>
      <button class="nav-btn" data-mode="task"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>任务</button>
      <button class="nav-btn" data-mode="teach"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V15c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.2"/></svg>教学</button>
    </nav>
    <button class="new-btn" id="newBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>开始新的对话</button>

    <div class="side-label">最近 / RECENT</div>
    <div class="hist">
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>供求模型课堂讨论提纲<span class="t">10:24</span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>批改第 3 周作业（92 份）<span class="t">09:41</span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V15c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.2"/></svg>《经济学原理》大纲 v3<span class="t">昨天</span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>弹性概念的三种讲法<span class="t">昨天</span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>期中卷审校与难度复核<span class="t">周二</span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V15c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.2"/></svg>教学日历 · 9 月排课调整<span class="t">周一</span></button>
    </div>

    <div class="side-foot">
      <div class="avatar">林</div>
      <div><b>林老师</b><span>经济学院 · 讲师</span></div>
      <button class="gear" aria-label="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <main class="a-main">
    <div class="hero">
      <div class="eyebrow">2026-09-10 · 星期四 · 第 2 教学周 · 教师节</div>
      <h1>早上好，林老师</h1>
      <p class="hero-sub" id="heroSub">我在呢——概念、讲义、题目、文案，问一句就走。</p>

      <div class="modes" role="tablist" aria-label="模式切换">
        <button class="mode-btn on" data-mode="chat" role="tab" aria-selected="true">对话</button>
        <button class="mode-btn" data-mode="task" role="tab" aria-selected="false">任务</button>
        <button class="mode-btn" data-mode="teach" role="tab" aria-selected="false">教学</button>
      </div>
      <p class="mode-desc" id="modeDesc"><b>对话</b> · 即问即答，答案留在对话里</p>

      <div class="inputbox">
        <textarea id="input" placeholder="比如：用奶茶店的例子，给大一学生讲清“机会成本”" aria-label="输入框"></textarea>
        <div class="inputbar">
          <button class="chip-tool">EduWork-4.5 <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="chip-tool">✦ 深度思考</button>
          <div class="spacer"></div>
          <button class="icon-btn" aria-label="附件"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <button class="send" id="send" aria-label="发送"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>

      <div class="chips" id="chips"></div>
    </div>

    <!-- 对话：最佳实践 -->
    <section class="section" id="sec-chat">
      <div class="sec-head"><span class="eyebrow">最佳实践 / PRACTICES</span></div>
      <div class="grid-chat">
        <button class="card"><div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></div><b>概念讲解</b><p>用生活例子讲清“机会成本”，配 2 个课堂提问</p></button>
        <button class="card"><div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg></div><b>内容改写</b><p>3000 字讲义压成一页复习提纲，保留考点</p></button>
        <button class="card"><div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></div><b>随堂出题</b><p>按知识点与难度出题，附答案与解析</p></button>
        <button class="card"><div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></div><b>教学文案</b><p>复习动员邮件、调课通知、学生评语模板</p></button>
      </div>
    </section>

    <!-- 任务：进行中的任务 -->
    <section class="section" id="sec-task" hidden>
      <div class="sec-head"><span class="eyebrow">进行中的任务 / TASKS</span></div>
      <div class="task-list">
        <button class="task"><div class="body"><b>批改《经济学原理》第 3 周作业</b><span>78 / 92 份 · 预计还需 10 分钟 · 完成后自动生成讲评</span><div class="prog"><i style="width:85%"></i></div></div><span class="status run">进行中</span></button>
        <button class="task"><div class="body"><b>“宏观经济”文献整理入资料库</b><span>24 篇中已解析 10 篇 · 提取观点与出处</span><div class="prog"><i style="width:42%"></i></div></div><span class="status run">进行中</span></button>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var MODES = {
    chat:{
      label:'对话', desc:'<b>对话</b> · 即问即答，答案留在对话里',
      sub:'我在呢——概念、讲义、题目、文案，问一句就走。',
      ph:'比如：用奶茶店的例子，给大一学生讲清“机会成本”',
      chips:['把讲义压成一页复习提纲','按 Bloom 分级出 10 道选择题','写期中复习动员邮件','翻译英文摘要'],
      toast:'演示：进入对话，生成结果直接展示在对话中'
    },
    task:{
      label:'任务', desc:'<b>任务</b> · 整件事交给 AI 后台执行，进度随时看',
      sub:'把整件事交给我：拆步骤、跑全程，你只看结果。',
      ph:'比如：批改《经济学原理》第 3 周作业（92 份），完成后生成讲评',
      chips:['整理宏观文献 24 篇入资料库','生成第 4 章题库 30 题','汇总本周学情周报','导出第 2 周点名名单'],
      toast:'演示：创建异步任务，进度在首页与侧栏实时更新'
    },
    teach:{
      label:'教学', desc:'<b>教学</b> · 一句话起稿，成稿落到教学工作台精修',
      sub:'说一句话起稿——大纲、日历、教案、课件，成稿进工作台精修。',
      ph:'比如：为《经济学原理》生成 16 周教学大纲，两周一次测验',
      chips:['生成 16 周教学大纲','排本学期教学日历','写第 3 周教案','制作“供求模型”课件'],
      toast:'演示：AI 在对话中生成初稿，完成后一键进入对应教学页面编辑'
    }
  };
  var cur='chat';
  var $=function(s){return document.querySelector(s)};
  var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
  var input=$('#input'), toast=$('#toast'), timer=null;

  function showToast(msg){
    toast.textContent=msg; toast.classList.add('show');
    clearTimeout(timer); timer=setTimeout(function(){toast.classList.remove('show')},2600);
  }
  function renderChips(m){
    var box=$('#chips'); box.innerHTML='';
    MODES[m].chips.forEach(function(c){
      var b=document.createElement('button');
      b.className='chip'; b.textContent=c;
      b.onclick=function(){input.value=c; input.focus();};
      box.appendChild(b);
    });
  }
  function setMode(m){
    cur=m;
    $$('.mode-btn,.nav-btn').forEach(function(b){
      var on=b.dataset.mode===m;
      b.classList.toggle('on',on);
      if(b.getAttribute('role')==='tab') b.setAttribute('aria-selected',on);
    });
    $('#heroSub').textContent=MODES[m].sub;
    $('#modeDesc').innerHTML=MODES[m].desc;
    input.placeholder=MODES[m].ph;
    $('#sec-chat').hidden = m!=='chat';
    $('#sec-task').hidden = m!=='task';
    $('#sec-teach').hidden = m!=='teach';
    renderChips(m);
  }
  $$('.mode-btn,.nav-btn').forEach(function(b){ b.onclick=function(){setMode(b.dataset.mode)} });
  $('#send').onclick=function(){
    if(!input.value.trim()){ input.focus(); return; }
    showToast(MODES[cur].toast); input.value='';
  };
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); $('#send').click(); }
  });
  $$('#sec-teach .flow-card').forEach(function(c){
    c.onclick=function(){ showToast('演示：AI 生成初稿后，进入「'+c.dataset.dest+'」编辑（沿用现有界面）'); };
  });
  $('#newBtn').onclick=function(){ setMode('chat'); input.focus(); showToast('演示：开启新对话'); };
  setMode('chat');
})();
</script>
