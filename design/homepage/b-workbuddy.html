<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduWork · 首页 — 选定方向（WorkBuddy 结构 · 薄荷绿）</title>
<style>
  /* ============ EduWork 首页 · 选定方向 ============
     结构沿用 WorkBuddy（左侧栏区块导航 + 居中模式胶囊 + 大圆角输入 + 快捷卡）
     配色切换为现有系统「青樟」薄荷绿色系，与教学工作台保持同一语言
     侧栏导航：新建任务（=新对话）/ 专家·技能 / 资料库 / 消息提醒 */
  :root{
    --bg:#f6fafa; --surface:#ffffff; --line:#e3eef0;
    --mint:#16bda8; --mint-deep:#0b9c8c; --mint-ink:#087c72; --mint-soft:#e6f8f4;
    --orange:#ff8f63; --orange-soft:#fff1ea;
    --ink:#18364f; --muted:#6c8495; --faint:#9ab3bf;
    --radius-lg:24px; --radius-md:16px;
    --shadow-card:0 1px 2px rgba(24,54,79,.05);
    --shadow-pop:0 8px 24px rgba(24,54,79,.10);
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--ink);background:var(--bg)}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--mint-deep);outline-offset:2px}
  .app{display:grid;grid-template-columns:250px 1fr;height:100vh;overflow:hidden}

  /* ---------- 左侧栏：WorkBuddy 式紧凑导航 ---------- */
  .b-side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 12px}
  .brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#1fc4b0,#0b9c8c);display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(22,189,168,.32)}
  .brand b{font-size:17px;letter-spacing:-.01em}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .nav{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px}
  .nav-block{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;color:var(--muted);text-align:left;transition:all .15s}
  .nav-block svg{flex:none;opacity:.75}
  .nav-block:hover{background:#f2f8f8;color:var(--ink)}
  .nav-block .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
  .nav-block.primary{background:var(--mint-soft);color:var(--mint-ink);font-weight:600}
  .nav-block.primary svg{opacity:1}
  .nav-block.primary:hover{background:#d8f2ec}
  .side-label{font-size:11px;color:var(--faint);padding:12px 10px 4px;font-weight:600}
  .hist{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
  .hist-item{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:9px;font-size:12.5px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden}
  .hist-item:hover{background:#f2f8f8;color:var(--ink)}
  .hist-item svg{flex:none;opacity:.5}
  .hist-item .t{margin-left:auto;font-size:10.5px;color:var(--faint);flex:none}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1fc4b0,#0b9c8c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .side-foot b{font-size:13.5px;display:block;line-height:1.3}
  .side-foot span{font-size:11.5px;color:var(--muted)}
  .gear{margin-left:auto;padding:7px;border-radius:9px;color:var(--muted)}
  .gear:hover{background:#f2f8f8;color:var(--ink)}

  /* ---------- 主区 ---------- */
  .b-main{overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:64px 32px 56px;scrollbar-width:thin}
  .hero{width:100%;max-width:820px;text-align:center}
  .hero .date{font-size:12.5px;color:var(--muted)}
  h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
  .hero-sub{font-size:15px;color:var(--muted);min-height:24px}

  .modes{display:inline-flex;gap:2px;background:#e9f1f0;border-radius:999px;padding:4px;margin:26px 0 22px}
  .mode-btn{display:flex;align-items:center;gap:7px;padding:8px 22px;border-radius:999px;font-size:14px;color:var(--muted);transition:all .15s}
  .mode-btn:hover{color:var(--ink)}
  .mode-btn.on{background:var(--surface);color:var(--mint-ink);font-weight:600;box-shadow:0 2px 8px rgba(24,54,79,.10)}
  .mode-desc{display:none}

  /* 大输入框 */
  .inputbox{background:var(--surface);border-radius:var(--radius-lg);padding:18px 18px 12px;box-shadow:var(--shadow-pop);transition:box-shadow .2s}
  .inputbox:focus-within{box-shadow:0 0 0 4px rgba(22,189,168,.12),0 12px 32px rgba(24,54,79,.12)}
  .inputbox textarea{width:100%;border:none;outline:none;resize:none;background:transparent;font-family:var(--sans);font-size:15px;line-height:1.6;min-height:64px;color:var(--ink)}
  .inputbox textarea::placeholder{color:var(--faint)}
  .inputbar{display:flex;align-items:center;gap:8px;margin-top:6px}
  .pill-tool{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);background:#f2f6f5;border-radius:999px;padding:6px 12px;transition:all .12s}
  .pill-tool:hover{background:var(--mint-soft);color:var(--mint-ink)}
  .pill-tool.think.on{background:var(--mint-soft);color:var(--mint-ink)}
  .spacer{flex:1}
  .icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--muted)}
  .icon-btn:hover{background:#f2f6f5;color:var(--ink)}
  .send{width:38px;height:38px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(22,189,168,.35);transition:all .15s}
  .send:hover{background:var(--mint-deep);transform:translateY(-1px)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13px;color:var(--muted);transition:all .12s}
  .chip:hover{border-color:var(--mint);color:var(--mint-ink);background:var(--mint-soft)}

  /* 卡片区 */
  .section{width:100%;max-width:820px;margin-top:46px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .sec-head b{font-size:15px}
  .sec-head span{font-size:12.5px;color:var(--faint);cursor:pointer}
  .sec-head span:hover{color:var(--mint-ink)}
  .grid-chat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--surface);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-card);text-align:left;transition:transform .15s,box-shadow .15s;display:flex;gap:14px;align-items:flex-start}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
  .card .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
  .card b{font-size:14.5px;display:block}
  .card p{font-size:13px;color:var(--muted);margin-top:2px}

  .grid-teach{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tcard{background:var(--surface);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-card);text-align:left;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
  .tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
  .tcard .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
  .tcard b{font-size:15px}
  .tcard p{font-size:12.5px;color:var(--muted);margin:3px 0 12px;flex:1}
  .dest{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:8px;padding:5px 9px;align-self:flex-start}
  .dest svg{opacity:.8}

  .task-list{display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--radius-md);padding:15px 18px;box-shadow:var(--shadow-card);text-align:left;transition:box-shadow .15s}
  .task:hover{box-shadow:var(--shadow-pop)}
  .task .body{flex:1;min-width:0}
  .task b{display:block;font-size:14px}
  .task span{font-size:12.5px;color:var(--muted)}
  .prog{margin-top:8px;height:6px;border-radius:99px;background:#eaf2f3;overflow:hidden}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1fc4b0,#0b9c8c)}
  .status{flex:none;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:99px}
  .status.run{background:var(--mint-soft);color:var(--mint-ink)}
  .status.queue{background:#eef2f4;color:var(--muted)}
  .status.done{background:var(--orange-soft);color:#c96a3f}

  .concept-tag{position:fixed;right:16px;bottom:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:5px 10px;z-index:5;text-decoration:none}
  .concept-tag:hover{color:var(--mint-ink)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:13px;border-radius:12px;padding:11px 20px;opacity:0;pointer-events:none;transition:all .25s;z-index:9;max-width:80vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:960px){
    .app{grid-template-columns:1fr}
    .b-side{display:none}
    .grid-teach{grid-template-columns:1fr 1fr}
    h1{font-size:26px}
  }
  @media (max-width:620px){.grid-chat,.grid-teach{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <!-- ================= 左侧栏 ================= -->
  <aside class="b-side">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V15c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.2"/><path d="M22 8.5v5"/></svg>
      </div>
      <div><b>EduWork</b><small>AI 教学工作伙伴</small></div>
    </div>

    <nav class="nav" id="sideNav">
      <button class="nav-block primary" id="navNew">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>新建任务
      </button>
      <button class="nav-block" id="navExpert">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.2"/><path d="M4 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="m17.5 4 .7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/><path d="m19 13 .5 1.1 1.1.5-1.1.5-.5 1.1-.5-1.1-1.1-.5 1.1-.5z"/></svg>专家 · 技能
      </button>
      <button class="nav-block" id="navLib">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7"/></svg>资料库
      </button>
      <button class="nav-block" id="navMsg">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>消息提醒<span class="badge">3</span>
      </button>
    </nav>

    <div class="side-label">今天</div>
    <div class="hist">
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>供求模型课堂讨论提纲<span class="t">10:24</span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>批改第 3 周作业（92 份）<span class="t">09:41</span></button>
    </div>
    <div class="side-label">昨天</div>
    <div class="hist">
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V15c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.2"/></svg>《经济学原理》大纲 v3<span class="t"></span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>弹性概念的三种讲法<span class="t"></span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>期中卷审校与难度复核<span class="t"></span></button>
    </div>
    <div class="side-label">本周</div>
    <div class="hist">
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>教学日历 · 9 月排课调整<span class="t">周一</span></button>
      <button class="hist-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>宏观文献整理（进行中）<span class="t">周一</span></button>
    </div>

    <div class="side-foot">
      <div class="avatar">林</div>
      <div><b>林老师</b><span>经济学院 · 讲师</span></div>
      <button class="gear" aria-label="设置"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
    </div>
  </aside>

  <!-- ================= 主区 ================= -->
  <main class="b-main">
    <div class="hero">
      <div class="date">9月10日 · 星期四 · 教师节快乐 🎉</div>
      <h1>你好，林老师</h1>
      <p class="hero-sub" id="heroSub">把课堂内外的事，交给 EduWork。</p>

      <div class="modes" role="tablist" aria-label="模式切换">
        <button class="mode-btn on" data-mode="chat" role="tab" aria-selected="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>对话</button>
        <button class="mode-btn" data-mode="task" role="tab" aria-selected="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>任务</button>
        <button class="mode-btn" data-mode="teach" role="tab" aria-selected="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 10.8V15c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.2"/></svg>教学</button>
      </div>

      <div class="inputbox">
        <textarea id="input" placeholder="比如：用奶茶店的例子，给大一学生讲清“机会成本”" aria-label="输入框"></textarea>
        <div class="inputbar">
          <button class="pill-tool">EduWork-4.5 <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="pill-tool think" id="thinkBtn">✦ 深度思考</button>
          <div class="spacer"></div>
          <button class="icon-btn" aria-label="附件"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <button class="send" id="send" aria-label="发送"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>

      <div class="chips" id="chips"></div>
    </div>

    <!-- 对话：最佳实践 -->
    <section class="section" id="sec-chat">
      <div class="sec-head"><b>最佳实践</b><span>查看全部 →</span></div>
      <div class="grid-chat">

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var MODES = {
    chat:{
      sub:'把课堂内外的事，交给 EduWork。',
      ph:'比如：用奶茶店的例子，给大一学生讲清“机会成本”',
      chips:['把讲义压成一页复习提纲','按 Bloom 分级出 10 道选择题','写期中复习动员邮件','翻译英文摘要'],
      toast:'演示：进入对话，生成结果直接展示在对话中'
    },
    task:{
      sub:'交给 EduWork 跑全程：批改、整理、汇总，结果送达。',
      ph:'比如：批改《经济学原理》第 3 周作业（92 份），完成后生成讲评',
      chips:['整理宏观文献 24 篇入资料库','生成第 4 章题库 30 题','汇总本周学情周报','导出第 2 周点名名单'],
      toast:'演示：创建异步任务，进度在首页与侧栏实时更新'
    },
    teach:{
      sub:'大纲、日历、教案、课件——从一句话开始，到工作台成稿。',
      ph:'比如：为《经济学原理》生成 16 周教学大纲，两周一次测验',
      chips:['生成 16 周教学大纲','排本学期教学日历','写第 3 周教案','制作“供求模型”课件'],
      toast:'演示：AI 在对话中生成初稿，完成后一键进入对应教学页面编辑'
    }
  };
  var cur='chat';
  var $=function(s){return document.querySelector(s)};
  var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
  var input=$('#input'), toast=$('#toast'), timer=null;

  function showToast(msg){
    toast.textContent=msg; toast.classList.add('show');
    clearTimeout(timer); timer=setTimeout(function(){toast.classList.remove('show')},2600);
  }
  function renderChips(m){
    var box=$('#chips'); box.innerHTML='';
    MODES[m].chips.forEach(function(c){
      var b=document.createElement('button');
      b.className='chip'; b.textContent=c;
      b.onclick=function(){input.value=c; input.focus();};
      box.appendChild(b);
    });
  }
  function setMode(m){
    cur=m;
    $$('.mode-btn').forEach(function(b){
      var on=b.dataset.mode===m;
      b.classList.toggle('on',on);
      b.setAttribute('aria-selected',on);
    });
    $('#heroSub').textContent=MODES[m].sub;
    input.placeholder=MODES[m].ph;
    $('#sec-chat').hidden = m!=='chat';
    $('#sec-task').hidden = m!=='task';
    $('#sec-teach').hidden = m!=='teach';
    renderChips(m);
  }
  $$('.mode-btn').forEach(function(b){ b.onclick=function(){setMode(b.dataset.mode)} });
  $('#thinkBtn').onclick=function(){ this.classList.toggle('on'); };
  $('#send').onclick=function(){
    if(!input.value.trim()){ input.focus(); return; }
    showToast(MODES[cur].toast); input.value='';
  };
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); $('#send').click(); }
  });
  $$('#sec-teach .tcard').forEach(function(c){
    c.onclick=function(){ showToast('演示：AI 生成初稿后，进入「'+c.dataset.dest+'」编辑（沿用现有界面）'); };
  });
  $('#navNew').onclick=function(){ setMode('chat'); input.value=''; input.focus(); showToast('演示：新建任务（新对话）'); };
  $('#navExpert').onclick=function(){ showToast('演示：打开「专家 · 技能」'); };
  $('#navLib').onclick=function(){ showToast('演示：打开资料库（沿用现有界面）'); };
  $('#navMsg').onclick=function(){ showToast('演示：打开消息提醒'); };
  setMode('chat');
})();
</script>
